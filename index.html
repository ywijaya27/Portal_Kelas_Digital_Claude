<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal Kelas Digital</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem('pkd:v1:theme'));if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark'}catch(e){}</script>
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/app.js" defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="shell">
  <nav id="nav" aria-label="Menu utama">
    <div class="brand">Portal Kelas<div class="muted" style="color:#fff;opacity:.7;font-size:12px">Digital Learning</div></div>
    <a href="#/katalog" data-nav="katalog">Katalog</a>
    <a href="#/kelas-saya" data-nav="kelas-saya">Kelas Saya</a>
    <a href="#/transaksi" data-nav="transaksi">Transaksi</a>
    <a href="#/admin" data-nav="admin" id="navAdmin" hidden>Admin</a>
    <div class="foot">
      <select id="theme" aria-label="Tema"><option value="light">Terang</option><option value="dark">Gelap</option><option value="system">Sistem</option></select>
      <div id="gbtn"></div><div id="who"></div>
      <button class="btn ghost sm" id="out" hidden style="color:#fff;border-color:rgba(255,255,255,.4)">Keluar</button>
    </div>
  </nav>
  <main id="view"><div class="skel"></div></main>
  <aside id="rail"></aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
